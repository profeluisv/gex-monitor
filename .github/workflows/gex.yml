name: GEX Monitor NY

on:
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Forzar envío fuera de sesión NY'
        required: false
        default: false
        type: boolean

jobs:
  run-gex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install numpy pandas requests curl_cffi python-dateutil

      - name: Ejecutar GEX Monitor
        run: |
          if [ "${{ inputs.forzar }}" = "true" ]; then
            python gex_bot.py --forzar
          else
            python gex_bot.py
          fi
